<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.home %}Haoyang Wu — Computer Vision Research{% else %}{{ page.title | escape }} — Haoyang Wu{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#f7f8fa">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }} — Haoyang Wu">
  <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/academic/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/academic/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/academic/style.css' | relative_url }}">
  <script src="{{ '/assets/academic/site.js' | relative_url }}" defer></script>
</head>
<body class="{% if page.home %}home{% else %}inner-page{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Haoyang Wu, home"><span class="monogram" aria-hidden="true">hw<span>.</span></span><span class="brand-name">Haoyang Wu<span>COMPUTER VISION RESEARCH</span></span></a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="primary-navigation">Menu <span aria-hidden="true">+</span></button>
      <nav class="primary-nav" id="primary-navigation" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#research">Research</a>
        <a href="{{ '/publications/' | relative_url }}" {% if page.url contains '/publication' %}aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/' | relative_url }}#experience">Experience</a>
        <a href="{{ '/teaching/' | relative_url }}" {% if page.url contains '/teaching' %}aria-current="page"{% endif %}>Teaching</a>
        <a class="nav-contact" href="mailto:haoyangwu@hust.edu.cn">Get in touch <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer wrap">
    <a class="footer-name" href="{{ '/' | relative_url }}">Haoyang Wu<span class="blue">.</span></a>
    <p>Computer vision · Continuous visual intelligence</p>
    <span>© {{ site.time | date: '%Y' }} Haoyang Wu</span>
    <a href="#main" class="back-top">Back to top ↑</a>
  </footer>
</body>
</html>
